apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lowrider-nav
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/lowrider-nav
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
      - kind: Secret
        name: cluster-secrets
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
    - name: apps-base
    # routerd applies its own migrations at startup, so the `lowrider` role and
    # database (created by the ordered Job in core/postgres) must exist before
    # this rolls. Same ordering the other postgres-backed apps use.
    - name: postgres
