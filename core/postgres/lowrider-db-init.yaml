---
# Provisions the `lowrider` role and database for apps/lowrider-nav.
#
# WHY A JOB AND NOT THE CHART. The bitnami postgresql chart's initdb hooks run
# once, when PGDATA is first initialized — years ago, for this cluster — so they
# cannot add a database to a live server. Every other database here (kratos,
# vellum, …) was created by hand with `kubectl exec`, which leaves no record in
# git of what exists and why. This is the same three statements, run by the
# cluster instead of by a person, and re-running them is a no-op.
#
# WHY THE NAME CARRIES A SUFFIX. A Job's pod template is immutable: editing the
# script below in place would make Flux fail to apply it. Bump `-1` to `-2` to
# ship a changed script — prune removes the old Job, and the new one re-runs
# against the same idempotent statements.
#
# The `postgres` Flux Kustomization has `wait: true`, so it stays unready until
# this Job completes, which is exactly the ordering apps/lowrider-nav depends on.
apiVersion: batch/v1
kind: Job
metadata:
  name: lowrider-db-init-1
  namespace: core
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lowrider-db-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: psql
          # The image the server itself runs, so the client is never older than
          # the cluster it talks to.
          image: docker.io/bitnamilegacy/postgresql:16.1.0
          env:
            - name: PGHOST
              value: postgres.core.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: postgres-password
            - name: LOWRIDER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lowrider-db
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              echo "waiting for postgres at ${PGHOST}:${PGPORT}"
              for _ in $(seq 1 60); do
                if pg_isready -q; then break; fi
                sleep 5
              done
              pg_isready || { echo "postgres never became ready"; exit 1; }

              # 1. The role. Created WITHOUT a password so the credential never
              #    appears in this statement; it is set separately below.
              #    NOSUPERUSER and no BYPASSRLS: a superuser silently skips row
              #    level security, and this database's tables rely on it.
              if [ -z "$(psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'lowrider'")" ]; then
                echo "creating role lowrider"
                psql -v ON_ERROR_STOP=1 -c "CREATE ROLE lowrider WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION;"
              else
                echo "role lowrider already exists"
              fi

              # Set — or rotate to — the password held in the SOPS `lowrider-db`
              # Secret. psql expands :'pw' into a correctly quoted literal, so
              # the value is never interpolated by the shell and never lands in
              # this container's argv.
              psql -v ON_ERROR_STOP=1 -v pw="$LOWRIDER_DB_PASSWORD" -f - <<'SQL'
              ALTER ROLE lowrider WITH LOGIN PASSWORD :'pw';
              SQL

              # 2. The database. CREATE DATABASE cannot run inside a transaction
              #    block, so it is its own call rather than part of a DO block.
              if [ -z "$(psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'lowrider'")" ]; then
                echo "creating database lowrider"
                psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE lowrider OWNER lowrider;"
              else
                echo "database lowrider already exists"
              fi

              # 3. Inside that database. postgis is created here, by the
              #    superuser, rather than left to the application's first
              #    migration: the extension is not marked trusted on this server,
              #    so the non-superuser `lowrider` role cannot create it, and the
              #    migration's own CREATE EXTENSION IF NOT EXISTS then finds it
              #    already present. The schema grants are defence in depth — only
              #    `lowrider` may create objects in its own database.
              psql -v ON_ERROR_STOP=1 -d lowrider -f - <<'SQL'
              CREATE EXTENSION IF NOT EXISTS postgis;
              ALTER SCHEMA public OWNER TO lowrider;
              REVOKE ALL ON SCHEMA public FROM PUBLIC;
              GRANT ALL ON SCHEMA public TO lowrider;
              SQL

              # Stated, not assumed: the role must not be a superuser and must
              # not bypass RLS.
              echo "role flags (rolname|rolsuper|rolbypassrls):"
              psql -tAc "SELECT rolname, rolsuper, rolbypassrls FROM pg_roles WHERE rolname = 'lowrider';"
              echo "extensions in lowrider:"
              psql -d lowrider -tAc "SELECT extname, extversion FROM pg_extension ORDER BY 1;"
              echo "lowrider role and database provisioned"
