apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vellum
  namespace: apps
spec:
  interval: 10m0s
  chart:
    spec:
      chart: app-template
      version: 3.1.0
      interval: 10m0s
      sourceRef:
        kind: HelmRepository
        name: bjw-s-labs
        namespace: core
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # Values are inlined here (not a configMapGenerator ConfigMap) so the Flux
  # image-automation Setters strategy can find and rewrite the image.tag markers
  # below — it only scans YAMLs that follow k8s object conventions (apiVersion/
  # kind), which a Helm values ConfigMap source file does not.
  values:
    controllers:
      api:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
        containers:
          main:
            image:
              repository: ghcr.io/invakid404/vellum-api
              tag: main-20260815015246-0057564 # {"$imagepolicy": "flux-system:vellum-api:tag"}
            # P6 cutover (issue #16): flip the api to `-gate=enqueue-only`, so it
            # registers the publish routes and ENQUEUES CheckJobs onto the durable
            # postgres queue that the node-pinned `vellum-gate` worker already leases
            # and SEALS. k8s `args` REPLACES the image CMD wholesale, so we replicate
            # the image's default CMD verbatim and append the one new flag — dropping
            # `-addr=:8080` here would break the readiness/liveness probes below.
            # Deliberately NO `VELLUM_ADAPTER_LOCK`: the internet-facing api stays
            # enqueue-only with no adapter runner and no docker, so it can never mint
            # a pass without the gate's sealed evidence (the whole point of the split).
            args:
              - -addr=:8080
              - -db=/data/cv-builder.sqlite
              - -data-dir=/data/artifacts
              - -fixtures=/app/fixtures
              - -gate=enqueue-only
            env:
              TZ: "${TIMEZONE}"
              LLM_BASE_URL: "https://openrouter.ai/api/v1"
              LLM_MODEL: "google/gemini-3.1-flash-lite"
              KRATOS_PUBLIC_URL: "http://kratos.apps.svc.cluster.local:4433"
              # U0.3 tenant-isolation storage: postgres + s3/minio backends.
              # DATABASE_URL and the S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY are
              # SECRETS — they live in the SOPS `vellum` Secret and arrive via
              # the envFrom secretRef below, not here.
              STORAGE_BACKEND: "postgres"
              BLOB_BACKEND: "s3"
              S3_ENDPOINT: "http://minio.core.svc.cluster.local:9000"
              S3_REGION: "us-east-1"
              S3_BUCKET: "vellum"
              S3_USE_PATH_STYLE: "true"
              # Verified CV Additions — GitHub OAuth account-control. These two are
              # non-secret URLs; the CLIENT_ID/CLIENT_SECRET/OAUTH_PKCE_KEY are in the
              # SOPS `vellum` Secret (via envFrom below). The feature is fail-closed:
              # inert until all five are set. Callback host must equal APP_ORIGIN's
              # host; the /account/github/callback path is served by vellum-web.
              APP_ORIGIN: "https://vellum.${TAILSCALE_DOMAIN}"
              GITHUB_OAUTH_CALLBACK_URL: "https://vellum.${TAILSCALE_DOMAIN}/account/github/callback"
            envFrom:
              - secretRef:
                  name: vellum
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/live
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 20
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/ready
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
      web:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/invakid404/vellum-web
              tag: main-20260815015246-0057564 # {"$imagepolicy": "flux-system:vellum-web:tag"}
            env:
              PORT: "3000"
              ORIGIN: "https://vellum.${TAILSCALE_DOMAIN}"
              API_BASE_URL: "http://vellum-api.apps.svc.cluster.local:8080"
              BODY_SIZE_LIMIT: "12M"
              TZ: "${TIMEZONE}"
              KRATOS_PUBLIC_URL: "http://kratos.apps.svc.cluster.local:4433"
              PUBLIC_KRATOS_BROWSER_URL: "https://vellum.${TAILSCALE_DOMAIN}/kratos"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  initialDelaySeconds: 15
                  periodSeconds: 20
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 10
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      imagePullSecrets:
        - name: docker-config
    service:
      api:
        controller: api
        ports:
          http:
            port: 8080
      web:
        controller: web
        ports:
          http:
            port: 3000
    # No PersistentVolumeClaim: the api runs on Postgres (core/postgres) + S3
    # (core/minio) since U0.3, so it needs no local /data volume. Dropping the
    # RWO PVC removes the single-node volume dependency that repeatedly stranded
    # the pod (Multi-Attach) whenever the lima-k3s-worker node died. The api now
    # schedules on any node and survives node loss.
    ingress:
      web:
        className: tailscale
        annotations:
          tailscale.com/hostname: vellum
        hosts:
          - host: "vellum.${TAILSCALE_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: web
                  port: http
        tls:
          - hosts:
              - "vellum.${TAILSCALE_DOMAIN}"
