apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: webtty-share
  namespace: apps
spec:
  interval: 10m0s
  chart:
    spec:
      chart: app-template
      version: 3.1.0
      interval: 10m0s
      sourceRef:
        kind: HelmRepository
        name: bjw-s-labs
        namespace: core
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # Values inlined (not a configMapGenerator ConfigMap) so the Flux image-automation
  # Setters strategy can find and rewrite the image.tag marker below.
  values:
    controllers:
      main:
        # Two replicas are safe now that shared state (revocation denylist, single-use
        # tickets, rate windows) lives in Postgres and revocation crosses replicas via
        # LISTEN/NOTIFY. DATABASE_URL comes from the SOPS `webtty-share` Secret.
        replicas: 2
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Public-facing app: no k8s API access needed.
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
        containers:
          main:
            image:
              repository: ghcr.io/invakid404/webtty-share
              tag: main-20260826011753-8bdfb53 # {"$imagepolicy": "flux-system:webtty-share:tag"}
            # Defense-in-depth for a public-facing, RCE-capable app: a compromised
            # process can't escalate, write the root fs, or use extra capabilities.
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
              seccompProfile:
                type: RuntimeDefault
            env:
              TZ: "${TIMEZONE}"
              HOST: "0.0.0.0"
              PORT: "3010"
              # svelte-adapter-bun derives request origin from ORIGIN; must match the
              # ingress host so the /send POST origin check passes behind TLS.
              ORIGIN: "https://webtty-share.${TAILSCALE_DOMAIN}"
              SHARE_ALLOWED_ORIGINS: "https://webtty-share.${TAILSCALE_DOMAIN}"
              # Data lives on the Mac (hypnos); the pod reaches web-tty over the tailnet
              # via the core/hypnos-ts egress. Membership from REST (no local sessions.db).
              WEBTTY_MEMBERSHIP_SOURCE: "rest"
              WEBTTY_MEMBERSHIP_URL: "http://hypnos-ts.core.svc.cluster.local:3001"
              WEBTTY_MCP_URL: "http://hypnos-ts.core.svc.cluster.local:3003/mcp/sse"
              # Terminal view: the backend WS proxy dials web-tty's /ws/<id> over the tailnet
              # (Caddy :3001 → web-tty :3000, upgrade preserved). Without this the Terminal
              # view reports "not configured" and the Transcript still works (fails soft).
              WEBTTY_WS_URL: "ws://hypnos-ts.core.svc.cluster.local:3001"
              # Startup URL-validation allowlist: the upstream URLs above may only point at
              # loopback or these hosts (this is where the Basic credential is sent). Required
              # by the hardened build or it fails closed at startup.
              WEBTTY_ALLOWED_UPSTREAM_HOSTS: "hypnos-ts.core.svc.cluster.local"
              # Tailnet auto-participant: a share request arriving over the tailnet whose
              # Tailscale-User-Login is in this allowlist is treated as participant regardless of
              # the link's cap. Non-spoofable — Tailscale's proxy strips forged headers and public
              # funnel visitors carry no such header. Empty/unset = feature off (the default).
              WEBTTY_TAILNET_PARTICIPANT_LOGINS: "invakid404@github"
              # Files tab (read-only project browser): the backend dials sftpgo on hypnos over the
              # same core/hypnos-ts egress. HOST must ALSO be in WEBTTY_ALLOWED_UPSTREAM_HOSTS (this
              # is where the SFTP private key is sent) or the pod fails closed at startup — use the
              # FQDN so it matches that allowlist. The private key is WEBTTY_FILES_SFTP_PRIVATE_KEY
              # from the SOPS Secret below. All three of host / host key / private key are required,
              # else the tab is hidden and nothing connects (fail-soft, like the WS proxy).
              WEBTTY_FILES_SFTP_HOST: "hypnos-ts.core.svc.cluster.local"
              WEBTTY_FILES_SFTP_PORT: "51873"
              WEBTTY_FILES_SFTP_USER: "webtty-share"
              # Pinned PUBLIC host key, verified before auth — no trust-on-first-use.
              WEBTTY_FILES_SFTP_HOST_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHuV2rjv5NVddNDxvQJT4tSCLvNzn5xDADNwJxAf2Zpf"
              # Roots that may be mounted DIRECTLY, not only their descendants.
              #
              # The auto-attach rail requires a project to be strictly *under* a root, which is
              # what stops /Users/inva/Coding exposing every repo at once. That also blocks the
              # legitimate case of an agent whose working directory IS the shared directory.
              # This is a separate list for exactly those paths. Keep it short — a flat root
              # exposes everything in it as soon as a session sits there.
              #
              # hypnos' reconciler LaunchAgent (com.webtty-share.files-reconcile) must carry the
              # SAME value: both layers check independently and both must agree, so change them
              # together, reconciler first.
              WEBTTY_FILES_FLAT_ROOTS: "/Users/inva/Downloads"
              # No WEBTTY_MCP_CALLER_ID: the app derives the MCP caller from the share
              # (anchor id for reads, target id for sends) — both are always real sessions,
              # so no dedicated caller session is needed. Set the env only to force an override.
            # SHARE_SIGNING_SECRET, WEBTTY_BASIC_AUTH, DATABASE_URL and WEBTTY_FILES_SFTP_PRIVATE_KEY
            # come from the SOPS `webtty-share` Secret.
            envFrom:
              - secretRef:
                  name: webtty-share
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: 3010
                  initialDelaySeconds: 10
                  periodSeconds: 20
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3010
                  initialDelaySeconds: 5
                  periodSeconds: 10
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      imagePullSecrets:
        - name: docker-config
    # readOnlyRootFilesystem needs a writable /tmp for the Bun runtime.
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      main:
        controller: main
        ports:
          http:
            port: 3010
          admin:
            port: 3011
    ingress:
      main:
        className: tailscale
        annotations:
          tailscale.com/hostname: webtty-share
          tailscale.com/funnel: "true"
        hosts:
          - host: "webtty-share.${TAILSCALE_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - "webtty-share.${TAILSCALE_DOMAIN}"
      admin:
        className: tailscale
        # NO tailscale.com/funnel — admin API stays tailnet-only (minting = host control).
        annotations:
          tailscale.com/hostname: webtty-share-admin
        hosts:
          - host: "webtty-share-admin.${TAILSCALE_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: main
                  port: admin
        tls:
          - hosts:
              - "webtty-share-admin.${TAILSCALE_DOMAIN}"
