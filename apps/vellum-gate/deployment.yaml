# vellum-gate — the fail-closed render-check gate (cv-builder issue #16, P5).
#
# WHAT THIS IS. A single worker that leases CheckJobs off the durable Postgres
# queue vellum-api already writes to, runs three digest-pinned adapter containers
# against a rendered CV, and SEALS the result. The seal is the point: a
# rendercheck.SealedCheck is the only evidence the publisher and scorer accept and
# it can only be minted inside the package that runs the adapters, so the process
# that measures MUST be the process that seals. That is why the gate is a workload
# and not a config flag on the api.
#
# WHY IT IS ITS OWN POD. Running the adapters needs a container runtime. Giving
# that to vellum-api would put a PRIVILEGED docker daemon inside the pod that
# serves user requests and holds the Postgres + S3 credentials. This pod is the
# isolation: it is not in any Service, has no Ingress, mounts no service-account
# token, and the api is untouched by this file.
#
# WHY IT IS PINNED TO ONE NODE. `hydra` is the worker with real headroom (~25% cpu
# / ~36% mem) and it is not the control plane. dind's image store is an emptyDir, so
# every reschedule costs re-materialising ~240 MB of adapters into it; pinning keeps
# that rare and keeps the privileged container somewhere known. Same mechanism the
# windmill video worker already uses.
#
# NOTHING IN THIS POD TALKS TO A REGISTRY. The three pinned adapter images are baked
# into the gate-worker image as loadable archives and `docker load`ed into dind at
# startup. They used to be `docker pull`ed at pod start instead — and a docker client
# hands the registry credential to the DAEMON to perform a pull, so that design
# delivered the cluster's GHCR secret to the privileged daemon on every start. The
# only pull left in this pod is the kubelet's, of the gate-worker image itself, and
# kubelet credentials are exposed to neither container.
#
# WHAT IT DOES NOT DO. P5 deploys the gate; it does not turn publishing on. The api
# still runs without an adapter lock, so it registers no publish routes and enqueues
# nothing — this worker will idle on an empty queue until the api is flipped to
# `-gate=enqueue-only` (P6). That is the intended end state of this change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vellum-gate
  namespace: apps
  labels:
    app.kubernetes.io/name: vellum-gate
    app.kubernetes.io/instance: vellum-gate
    app.kubernetes.io/component: render-check-gate
    app.kubernetes.io/part-of: vellum
spec:
  # ONE. The adapters run sequentially inside one check, and one check at a time is
  # the whole intended throughput on Pi-class hardware. More replicas would also
  # multiply the privileged daemon, for a queue that is nearly always empty.
  replicas: 1
  # RollingUpdate with a surge, not Recreate: on a contract-changing release the
  # departing worker must keep draining ITS OWN version's jobs while the new build
  # is already claiming the next version's, so the two must briefly overlap. This
  # is safe because (1) the queue is now VERSION-PARTITIONED — a worker only ever
  # claims jobs for its own gate_contract_version (cv-builder
  # domain.GateContractVersion), so two builds over one queue never contend for
  # the same job; (2) each pod gets its OWN dind emptyDir — emptyDir is per-pod,
  # never shared between pods, so a second worker cannot touch the first's docker
  # storage; and (3) hydra has ample headroom for two gate pods for the length of
  # a rollover. maxUnavailable=0 keeps a worker leasing throughout; SIGTERM drains
  # the departing one (see terminationGracePeriodSeconds).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vellum-gate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vellum-gate
        app.kubernetes.io/instance: vellum-gate
      annotations:
        # Restart when the `vellum` Secret rotates, exactly as the api does.
        reloader.stakater.com/auto: "true"
    spec:
      nodeSelector:
        kubernetes.io/hostname: hydra
      # Nothing here talks to the Kubernetes API. A pod that runs a privileged
      # daemon should not also carry a token that can ask the cluster questions.
      automountServiceAccountToken: false
      # For the PRIVATE gate-worker image, AND IT ALONE. This is the kubelet's
      # credential for its own pull: the node reads this Secret, the containers
      # never see it, and no process in this pod is handed it. It is deliberately
      # NOT also projected into the pod any more — see the `dind` container below
      # for what that used to mean. The adapters need no pull credential because
      # they need no pull: they ship inside the gate-worker image.
      imagePullSecrets:
        - name: docker-config
      # SIGTERM makes the worker stop claiming and finish the job in flight.
      # Killing a check between the adapters and the commit is recoverable — that
      # is what the lease is for — but recovering it means re-running three
      # containers, so a planned rollout should not do it. Three adapter timeouts
      # (4 + 8 + 4 s) plus a render and the commit fit well inside this; the wide
      # ceiling is deliberate headroom so a SIGKILL can never land mid-adapter and
      # orphan a job during a contract-bump rollover — the departing worker owns
      # the last drain of ITS version, and no newer-version worker will re-claim
      # its jobs. The worker exits as soon as it is idle, so the ceiling only
      # bounds the worst case; it does not slow a normal (idle-queue) rollout.
      terminationGracePeriodSeconds: 600
      containers:
        # --- the sealer ------------------------------------------------------------
        - name: gate-worker
          # Under Flux image automation (ImagePolicy flux-system:vellum-gate-worker,
          # see ./imageautomation.yaml), auto-advanced from main exactly like
          # vellum-api/web. This REVERSES the earlier hand-pinned policy, and is safe
          # now because the queue is VERSION-PARTITIONED: a worker only ever claims
          # jobs for its own gate_contract_version, so an api and a worker on
          # different builds can never mis-meet over a job and a rollover drains
          # seamlessly (that is the whole point of the gate-contract-version work).
          # The image still carries the adapter lock the binary embeds ("which image"
          # == "which certification is in force"); that lock changes ONLY through the
          # deliberate, separately-reviewed adapters re-cert flow, and it is that
          # reviewed, merged result that CI-on-main publishes here. The tag is
          # CI-on-main only (branch-protected) — the same trust basis as the api.
          image: ghcr.io/invakid404/vellum-gate-worker:main-20260815015246-0057564 # {"$imagepolicy": "flux-system:vellum-gate-worker"}
          args:
            - -mode=worker
          env:
            - name: TZ
              value: "${TIMEZONE}"
            # Same backends the api uses, selected the same way (U0.3 env contract).
            # The worker re-reads the draft and writes the release through the same
            # cvbuilder service the api builds, so a worker pointed at different
            # backends would publish something the api would not have.
            - name: STORAGE_BACKEND
              value: "postgres"
            - name: BLOB_BACKEND
              value: "s3"
            - name: S3_ENDPOINT
              value: "http://minio.core.svc.cluster.local:9000"
            - name: S3_REGION
              value: "us-east-1"
            - name: S3_BUCKET
              value: "vellum"
            - name: S3_USE_PATH_STYLE
              value: "true"
            # The lock is a PATH, not a secret: the loadable tree (the lock plus the
            # three adapters/<id>/oci-manifest.json files LoadLock resolves beside
            # it) is baked into the image. LoadLock refuses any lock whose canonical
            # identity differs from the copy compiled into this binary, so a
            # mismatched pair does not produce a weaker gate — it produces no gate.
            - name: VELLUM_ADAPTER_LOCK
              value: "/app/rendercontract/adapter-lock.json"
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"
            # THERE IS DELIBERATELY NO DOCKER_CONFIG HERE. It used to point at a
            # read-only projection of the `docker-config` pull Secret so the docker
            # CLI could pull the adapters — but the CLI does not perform a pull, the
            # DAEMON does, and the client hands it the credential to do so. This pod
            # runs that daemon PRIVILEGED. The adapters now ship inside the image, so
            # there is nothing to pull and no credential to leak; the image's
            # entrypoint asserts this variable's absence at startup and refuses to
            # become a worker if it comes back, so re-adding it fails loudly rather
            # than quietly restoring the flow.
            # THREE KEYS, NAMED. Not `envFrom: secretRef: vellum`, which would also
            # hand this pod OPENROUTER_API_KEY and GITHUB_TOKEN — credentials the
            # worker has no code path to use (it never constructs an LLM or a source
            # provider). The pod that runs a privileged daemon gets the least of that
            # Secret it can do its job with.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vellum
                  key: DATABASE_URL
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: vellum
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: vellum
                  key: S3_SECRET_ACCESS_KEY
          volumeMounts:
            # The dind socket. Shared emptyDir, NOT the host's docker socket.
            - name: dind-sock
              mountPath: /var/run
            # readOnlyRootFilesystem needs a writable /tmp ($HOME and $TMPDIR both
            # point here in the image).
            - name: tmp
              mountPath: /tmp
          # No probes. This container serves no port and exposes no health surface;
          # an HTTP probe would be a fiction and an exec probe would need a shell in
          # the check path. Liveness here is "the process is up", which is what the
          # restart policy already means. Its readiness is instead PROVEN at startup:
          # the entrypoint refuses to exec the worker until all three pinned adapters
          # are present and identified, so a gate that cannot measure never leases.
          resources:
            requests:
              # Real CPU, not the api's 50m: extraction is CPU-bound and the lock's
              # 4/8/4 s timeouts are part of its immutable identity — a throttled
              # check does not fail slowly, it returns `blocked_inconclusive`.
              cpu: 250m
              memory: 256Mi
            limits:
              # NO cpu limit, deliberately: the ceiling that protects hydra from this
              # pod is the memory limit, and a CPU limit here buys throttling in
              # exchange for the one failure mode this workload cannot tolerate.
              memory: 768Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
        # --- the container runtime the adapters run on -----------------------------
        # Modelled on the ARC runners (apps/arc/runners/*/helmrelease.yaml), which
        # have run this exact image, privileged, over a shared emptyDir socket in
        # this namespace for a long time. The differences from that precedent are
        # both deliberate: the socket group is the gate-worker's GID so the sealer
        # can stay non-root, and the daemon is bounded.
        - name: dind
          # PINNED BY TAG AND DIGEST, for a stronger reason than the gate-worker
          # above. This is the PRIVILEGED daemon, and it is the process the worker
          # trusts to answer `image inspect` and to run the adapters — it is inside
          # the seal's trust boundary. `VerifyManifestBinding` proves the worker's
          # committed adapter manifest bytes; it proves nothing about the behaviour
          # of the daemon that reports on them. A mutable tag resolving to different
          # bytes on a re-pull (upstream retag, compromised registry or mirror, cache
          # refresh) would put a different privileged daemon in that position, and a
          # substituted daemon can report the expected image id and platform and
          # synthesize the expected probe and adapter output. So this digest is part
          # of the cert-runtime review exactly as the gate-worker's is, and it moves
          # only by an owner's reviewed edit.
          #
          # sha256:c90e58d3… is the multi-platform INDEX; on hydra (arm64) it resolves
          # to the linux/arm64 child
          # sha256:2afeb0c1357ac43eb81976a3a84995645872ab18644f6799677cd786de54cf40,
          # which is the manifest actually run. Pinning the index rather than that
          # child keeps the pin immutable without making the manifest wrong for any
          # other node — the index enumerates its children by digest, so it is a
          # complete cryptographic pin either way.
          image: docker:24.0.7-dind-alpine3.18@sha256:c90e58d30700470fc59bdaaf802340fd25c1db628756d7bf74e100c566ba9589
          # THE LEADING `dockerd` IS LOAD-BEARING — do not "simplify" it away.
          # dockerd-entrypoint.sh injects `--host=tcp://0.0.0.0:2376` (with
          # generated TLS certs) ONLY when it is given no arguments or a first
          # argument starting with `-`. Naming `dockerd` explicitly skips that
          # block entirely, so this daemon listens on the shared unix socket and
          # NOTHING ELSE — verified: no TCP listener in the container. Drop the word
          # and the gate quietly starts serving a docker API on its pod IP; clear
          # DOCKER_TLS_CERTDIR instead and the same block serves :2375 with no TLS
          # at all. Passing `dockerd` also keeps tini as pid 1, which reaps the
          # one-shot adapter containers.
          args:
            - dockerd
            - --host=unix:///var/run/docker.sock
            # Makes the socket root:65532 0660, which is what lets the gate-worker
            # container reach it as a non-root user.
            - --group=65532
          securityContext:
            # THE ONE PRIVILEGED CONTAINER IN THIS CLUSTER'S APP NAMESPACE THAT IS
            # NOT A CI RUNNER — and it is confined to this pod. It runs no user code:
            # it runs exactly the three images the lock pins, each `--network none`,
            # one shot, stdin to stdout.
            privileged: true
          volumeMounts:
            - name: dind-sock
              mountPath: /var/run
            - name: dind-storage
              mountPath: /var/lib/docker
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              # The adapter containers this daemon starts are nested inside THIS
              # container's cgroup, so this number has to cover dockerd plus the
              # heaviest adapter at once (pdfminer: CPython + cryptography). 512Mi
              # leaves that pair no margin, and an OOM there is not a crash — it is a
              # silent `blocked_inconclusive`, i.e. a gate that stops being able to
              # publish without saying so. 1Gi keeps the whole pod's ceiling at
              # 1.75Gi, comfortably inside hydra's headroom.
              memory: 1Gi
      volumes:
        # The socket. An emptyDir shared by the two containers — the host's docker
        # socket is never mounted anywhere.
        - name: dind-sock
          emptyDir: {}
        # dind's image store. Ephemeral on purpose: the adapters are re-materialised
        # by content address on every pod start (the entrypoint `docker load`s the
        # archives baked into the gate-worker image, and the engine derives each
        # image's id from the archive's own config blob), so there is no stale-image
        # state to reason about. Measured footprint with all three loaded: 236.3 MB.
        - name: dind-storage
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      # NO docker-config VOLUME. There used to be one here — the namespace's GHCR
      # pull credential projected as a docker CLI config — so the dind daemon could
      # pull the three private adapter images. Nothing in this pod contacts a
      # registry any more, so nothing in this pod needs a registry credential.
