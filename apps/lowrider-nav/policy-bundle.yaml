apiVersion: v1
kind: ConfigMap
metadata:
  name: lowrider-nav-policy
  namespace: apps
# The routing policy release routerd is configured against, verbatim from the
# application repo (backend/deploy/policy/local.bundle.json at cb4fbc1).
#
# It is here rather than in the routerd image on purpose: the image bakes no
# policy bundle and no feature flag, so which approved release is in force is a
# deployment decision, visible in git, reviewable in a diff. The four identifiers
# in helmrelease.yaml resolve against this document and its declared checksum;
# routerd re-derives that checksum from the canonical content at startup and
# refuses a bundle whose declaration disagrees, so an edit here that is not also
# a re-stamped release fails closed at boot.
#
# The `-local-01` suffixes are the release's own identifiers and are kept exactly
# as issued: they are how a stored evaluation says which release produced it, and
# renaming them here would claim an approval that was never granted.
#
# Reloader rolls routerd when this ConfigMap changes (the controller carries
# reloader.stakater.com/auto).
data:
  bundle.json: |
    {
